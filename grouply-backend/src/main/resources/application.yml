spring:
  application:
    name: grouply-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/grouply}
    username: ${SPRING_DATASOURCE_USERNAME:grouply}
    password: ${SPRING_DATASOURCE_PASSWORD:grouply}
    driver-class-name: org.postgresql.Driver
    
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    serialization:
      write-dates-as-timestamps: false

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-to-secure-one-minimum-256-bits}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

server:
  port: ${PORT:8080}

upload:
  directory: ${UPLOAD_DIRECTORY:uploads}

logging:
  level:
    ee.grouply.backend: DEBUG
    org.springframework.security: WARN
