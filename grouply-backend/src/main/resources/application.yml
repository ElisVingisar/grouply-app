spring:
  application:
    name: grouply-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/grouply}
    username: ${DATABASE_USERNAME:grouply}
    password: ${DATABASE_PASSWORD:pass}

  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:update}
    show-sql: ${SHOW_SQL:true}
    properties:
      hibernate.jdbc.time_zone: UTC

  h2:
    console:
      enabled: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

grouply:
  upload-dir: ${UPLOAD_DIR:uploads}

jwt:
  secret: ${JWT_SECRET:dev-secret-key-change-me-to-secure-one}
  expiration-ms: ${JWT_EXPIRATION_MS:604800000} # 7 days

logging:
  level:
    ee.grouply.backend.security.JwtFilter: DEBUG
    org.springframework.security: WARN