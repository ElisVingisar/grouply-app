# ============================================
# GROUPLY CI PIPELINE
# ============================================

name: Grouply CI

on:
  
  push:
    branches:
      - main
      - develop
  
  pull_request:
    branches:
      - main
      - develop

# ════════════════════════════════════════════
# JOBS
# ════════════════════════════════════════════
jobs:

  # ──────────────────────────────────────────
  # JOB 1: BACKEND TESTS
  # ──────────────────────────────────────────
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Run backend tests
        working-directory: ./grouply-backend
        run: ./mvnw clean test

  # ──────────────────────────────────────────
  # JOB 2: FRONTEND BUILD
  # ──────────────────────────────────────────
  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './grouply-frontend/package-lock.json'

      - name: Install dependencies
        working-directory: ./grouply-frontend
        run: npm ci

      - name: Build frontend
        working-directory: ./grouply-frontend
        run: npm run build